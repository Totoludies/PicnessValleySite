<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Picness Valley</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="preload" as="image" href="TemplateData/totoludies.png">
  </head>
  <body>
    <!-- Picness Valley loading page (ADR 0139), based on Unity's Default template -->
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="town-loading">
          <div id="town-gauge"><div id="town-gauge-fill"></div></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Picness Valley</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");
      const loading = document.querySelector("#town-loading");
      const gaugeFill = document.querySelector("#town-gauge-fill");

      // The gauge: the download fills it to 90 %, then it creeps towards 100 % while the engine
      // starts and loads the first scene, and fills up when the game says its first scene is shown.
      const DOWNLOAD_SHARE = 0.9;
      const FALLBACK_SECONDS = 20;
      let gauge = 0;
      let startTimer = null;
      let loadingDone = false;

      function setGauge(value) {
        gauge = Math.max(gauge, Math.min(1, value));
        gaugeFill.style.width = (100 * gauge) + "%";
      }

      function startCreeping() {
        if (startTimer || loadingDone)
          return;
        startTimer = setInterval(() => setGauge(gauge + (0.99 - gauge) * 0.05), 200);
      }

      // Called by the game (TownWebLoading.jslib) once the first scene has been drawn,
      // so the page never shows the black canvas while the engine starts.
      window.townHideLoading = function () {
        if (loadingDone)
          return;
        loadingDone = true;
        if (startTimer)
          clearInterval(startTimer);
        setGauge(1);
        setTimeout(() => {
          loading.classList.add("town-hidden");
          setTimeout(() => { loading.style.display = "none"; }, 450);
        }, 250);
      };

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.gz",
        frameworkUrl: buildUrl + "/WebGL.framework.js.gz",
        codeUrl: buildUrl + "/WebGL.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "Totoludies",
        productName: "Picness Valley",
        productVersion: "0.144",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }
      // Desktop style: the canvas fills the window above the footer (style.css), so the page
      // never scrolls, in a browser tab as in the website's frame.

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          setGauge(progress * DOWNLOAD_SHARE);
          if (progress >= 1)
            startCreeping();
        }).then((unityInstance) => {
          startCreeping();
          // safety net: never keep the loading screen if the game did not call townHideLoading
          setTimeout(window.townHideLoading, FALLBACK_SECONDS * 1000);
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
